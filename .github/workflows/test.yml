name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish から呼ぶ。テストを通っていないものを公開しないため、
  # 同じ内容を publish 側に書き写さずに再利用する。
  workflow_call:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 型を剥がして .ts をそのまま実行する機能が要る。22.18 以降。
        node-version: ["22.18", "24"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      # 実行時の依存はゼロ。開発時のみ tsc を使う。
      - run: npm ci
      - name: 型検査
        run: npm run check
      - name: 単体テスト
        run: npm test

      # デモページは src のビルド結果を埋め込んでいる。書き直しではないので、
      # src を直したら生成し直す必要がある。忘れるとページだけ古いまま残る。
      - name: デモページが src と一致しているか
        run: npm run demo:check
