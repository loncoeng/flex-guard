# Publish to npm when a tag is pushed.
#
# Authenticated with OIDC rather than a token: GitHub signs a short-lived
# assertion and npm verifies it, so **there is no key anywhere to steal**.
#
# Packages have actually been taken over this way — phishing aimed at an npm
# maintainer, a long-lived token taken, and the package is theirs. Not keeping
# anything that can be taken is the one reliable answer to it.
#
# The Trusted Publisher configuration on npm's side has to agree with this
# file's name and the repository name. Change one of them on its own and
# publishing stops working.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    if: github.repository == 'loncoeng/flex-guard'
    runs-on: ubuntu-latest
    permissions:
      # Needed to issue the OIDC assertion. Without it there is no way to
      # authenticate at all.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needs a version that supports trusted publishing.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Check the tag against the version in package.json. Without this, a
      # v0.3.0 tag quietly publishes 0.2.0.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "The tag says v$tag and package.json says $pkg. Make them agree."
            exit 1
          fi
          echo "Tag and version are both $pkg"

      # OIDC needs a recent npm, and the bundled one can be older than that.
      - run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public
