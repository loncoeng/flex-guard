# タグを打つと npm へ公開する。
#
# 認証はトークンではなく OIDC で行う。GitHub が署名した短命の証明を npm が
# 検証する仕組みなので、**盗める鍵がどこにも無い**。
#
# npm の管理者を狙ったフィッシングで、長期間有効なトークンが奪われて
# パッケージが乗っ取られる事故が実際に起きている。奪われるものを置かない
# のが一番確実な対策になる。
#
# npm 側の設定 (Trusted Publisher) と、このファイル名・リポジトリ名が
# 一致している必要がある。片方だけ変えると公開できなくなる。

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    if: github.repository == 'lon-coeng/flex-guard'
    runs-on: ubuntu-latest
    permissions:
      # OIDC の証明を発行するために要る。これが無いと認証できない。
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # trusted publishing に対応した版が要る。
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # package.json の version と、打たれたタグが食い違っていないか見る。
      # ここを見ないと、v0.3.0 のタグで 0.2.0 が公開される事故が起きる。
      - name: タグと version が一致しているか
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "タグ v$tag に対して package.json は $pkg です。合わせてください。"
            exit 1
          fi
          echo "タグと version はどちらも $pkg です"

      # OIDC は新しめの npm でしか使えない。同梱版だと古いことがある。
      - run: npm install -g npm@latest

      - name: npm へ公開する
        run: npm publish --provenance --access public
